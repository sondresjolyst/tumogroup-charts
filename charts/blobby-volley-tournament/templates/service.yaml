apiVersion: v1
kind: Service
metadata:
  name: {{ include "blobby-volley-tournament.fullname" . }}
  labels:
    {{- include "blobby-volley-tournament.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "blobby-volley-tournament.selectorLabels" . | nindent 4 }}
