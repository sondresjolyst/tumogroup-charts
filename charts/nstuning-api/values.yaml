replicaCount: 1

image:
  repository: sondresjo/nstuning-api
  pullPolicy: IfNotPresent
  tag: "v1.6.12"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount: {}

automountServiceAccountToken: false

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: nstuning-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  storageClass: "nfs"
  accessMode: ReadWriteMany
  size: 20Gi
  mountPath: /data/reports
  imagesPath: /data/images
  imagesSubPath: images

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

env: []
