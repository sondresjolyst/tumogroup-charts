name: 📦 Update Helm Chart

on:
  workflow_call:
    inputs:
      chart_name:
        description: "Name of the chart to update (e.g. nstuning-api)"
        type: string
        required: true
      tag:
        description: "New image tag (e.g. v1.5.3)"
        type: string
        required: true
    secrets:
      CHARTS_PAT:
        required: true

permissions: {}

jobs:
  update-chart:
    name: Update ${{ inputs.chart_name }} chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tumogroup-charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sondresjolyst/tumogroup-charts
          token: ${{ secrets.CHARTS_PAT }}

      - name: Bump chart version and update image tag
        id: bump
        env:
          CHART_NAME: ${{ inputs.chart_name }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "$CHART_NAME" in
            "" | *[!a-z0-9-]*) echo "Invalid chart name: $CHART_NAME" >&2; exit 1 ;;
          esac
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid tag: $TAG" >&2; exit 1 ;;
          esac

          CHART="charts/$CHART_NAME/Chart.yaml"
          VALUES="charts/$CHART_NAME/values.yaml"

          CURRENT=$(grep '^version:' "$CHART" | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i "s/^version: .*/version: $NEW_VERSION/" "$CHART"
          sed -i "s/tag: \".*\"/tag: \"$TAG\"/" "$VALUES"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.CHARTS_PAT }}
          CHART_NAME: ${{ inputs.chart_name }}
          TAG: ${{ inputs.tag }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          BRANCH="chore/update-$CHART_NAME-$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "charts/$CHART_NAME/Chart.yaml" "charts/$CHART_NAME/values.yaml"
          git commit -m "chore: update $CHART_NAME to $TAG"
          git push origin "$BRANCH"

          gh pr create \
            --repo sondresjolyst/tumogroup-charts \
            --title "chore: update $CHART_NAME to $TAG" \
            --body "Updates \`$CHART_NAME\` image tag to \`$TAG\` and bumps chart version to \`$NEW_VERSION\`." \
            --base main \
            --head "$BRANCH"
